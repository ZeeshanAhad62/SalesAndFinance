<!DOCTYPE html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="light"  data-sidebar-size="lg" data-sidebar-image="none"> 
	
	<head>
		
		<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">
		
		<link rel="stylesheet" href="assets/css/style.css">

	</head>
	<body>
	
		<!-- Main Wrapper -->
		<div class="main-wrapper login-body">
			<div class="login-wrapper">
				<div class="container">
					<img class="img-fluid logo-dark mb-2" src="assets/img/logo2.png" alt="Logo">
					<div class="loginbox">
						<div class="login-right">
							<div class="login-right-wrap">
								<h1>Login</h1>
								<p class="account-subtitle">Access to our dashboard</p>
								<form id="loginForm">
									<div class="mb-3">
										<label>Email Address</label>
										<input id="email" type="email" class="form-control" required>
									</div>
									<div class="mb-3 position-relative">
										<label>Password</label>
										<div class="position-relative">
											<input id="password" type="password" class="form-control pe-5" required>
											<i class="fa-solid fa-eye toggle-password position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer"></i>
										</div>
									</div>
									
									<button class="btn btn-primary w-100" type="submit">Login</button>
								</form>
								<div class="text-center mt-3">Don't have an account yet? <a href="register.html">Register</a></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="env.js"></script>
		<script src="login.js"></script>
	</body>

</html>
