<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
	<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="main-wrapper login-body">
        <div class="login-wrapper">
            <div class="container">
                <img class="img-fluid logo-dark mb-2" src="assets/img/logo2.png" alt="Logo">
                <div class="loginbox">
                    <div class="login-right">
                        <div class="login-right-wrap">
                            <h1>Register</h1>
                            <p class="account-subtitle">Access to our dashboard</p>
                            <form id="registrationForm">
                                <div class="mb-3">
                                    <label>First Name</label>
                                    <input id="firstName" class="form-control" type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label>Last Name</label>
                                    <input id="lastName" class="form-control" type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label>Email Address</label>
                                    <input id="email" class="form-control" type="email" required>
                                </div>
                                <div class="mb-3">
                                    <label>Contact Number</label>
                                    <input id="contactNumber" class="form-control" type="text" required>
                                </div>
                                <div class="mb-3 position-relative">
                                    <label>Password</label>
                                    <input id="password" class="form-control" type="password" required>
                                    <i class="fa fa-eye toggle-password position-absolute end-0 top-50 translate-middle-y me-3" data-target="#password"></i>
                                </div>
                                <div class="mb-3 position-relative">
                                    <label>Confirm Password</label>
                                    <input id="confirmPassword" class="form-control" type="password" required>
                                    <i class="fa fa-eye toggle-password position-absolute end-0 top-50 translate-middle-y me-3" data-target="#confirmPassword"></i>
                                </div>
                                <button class="btn btn-primary w-100" type="submit">Register</button>
                            </form>
                            <div class="text-center mt-3">Already have an account? <a href="login.html">Login</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
	<script src="env.js"></script>
    <script src="register.js"></script>
</body>
</html>
